[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poe-bulk-export"
version = "0.2.0"
description = "Export Poe.com chats to Markdown/JSON from the raw message data Poe ships with each chat page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Poe Bulk Export" }]
dependencies = [
  "playwright>=1.40",
  "httpx>=0.27",
  "tqdm>=4.66",
  "typer>=0.12",
  "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
poe-bulk-export = "poe_bulk_export.cli:app"

[tool.setuptools.packages.find]
include = ["poe_bulk_export*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
